<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Home</title>
  <link rel="stylesheet" href="../style.css">
</head>

<body>
  <header>
    <h1>Home</h1>

    <button class="nav-toggle" aria-label="Toggle navigation">☰</button>

    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="../Product/product.html">Product</a>
      <a href="../Contact/contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <img
      src="/Image/Home.png"
      alt="Welcome banner for the website"
      class="img-responsive img-round img-shadow home-banner"
      loading="lazy"
      decoding="async"
    />

    <p>
      Welcome to our website! We are glad you’re here. Explore our products,
      learn more about our services, and feel free to contact us with any
      questions. Your satisfaction is our priority.
    </p>
  </main>

  <footer>
    <p>My New Website – 2026</p>
  </footer>

  <script>
    const toggle = document.querySelector(".nav-toggle");
    const nav = document.querySelector(".nav-links");

    toggle.addEventListener("click", () => {
      nav.classList.toggle("show");
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- FIXED CSS PATH -->
  <link rel="stylesheet" href="/Web-Design/style.css">
</head>

<body>
  <header>
    <h1>Product</h1>

    <button class="nav-toggle" aria-label="Toggle navigation">☰</button>

    <nav class="nav-links">
      <a href="/Web-Design/Home/index.html">Home</a>
      <a href="/Web-Design/Product/product.html">Product</a>
      <a href="/Web-Design/Contact/contact.html">Contact</a>
    </nav>
  </header>

  <main class="container">
    <!-- FIXED IMAGE PATH -->
    <img
      src="/Web-Design/Image/Product.png"
      alt="Flat lay of feminine products including shoes, sunglasses, perfume, watch and handbag on pink background"
      class="img-responsive img-round img-shadow product-banner"
      loading="lazy"
      decoding="async"
    />

    <!-- LU10 Responsive Table -->
    <div class="table-wrap">
      <table class="products">
        <caption>Product List</caption>

        <thead>
          <tr>
            <th>Name</th>
            <th>Price</th>
          </tr>
        </thead>

        <tbody>
          <tr>
            <td>Product A</td>
            <td>$0.00</td>
          </tr>
          <tr>
            <td>Product B</td>
            <td>$0.00</td>
          </tr>
        </tbody>

      </table>
    </div>
  </main>

  <footer class="container">
    <p>My New Website – 2026</p>
  </footer>

  <script>
    const toggle = document.querySelector(".nav-toggle");
    const nav = document.querySelector(".nav-links");

    toggle.addEventListener("click", () => {
      nav.classList.toggle("show");
    });
  </script>
</body>
</html>

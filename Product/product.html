<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product</title>
  <link rel="stylesheet" href="../style.css">
</head>

<body>
  <header>
    <h1>Product</h1>

    <button class="nav-toggle" aria-label="Toggle navigation">☰</button>

    <nav class="nav-links">
      <a href="../Home/index.html">Home</a>
      <a href="product.html">Product</a>
      <a href="../Contact/contact.html">Contact</a>
    </nav>
  </header>

  <main class="container">
    <img
      src="/Image/Product.png"
      alt="Flat lay of feminine products including shoes, sunglasses, perfume, watch and handbag on pink background"
      class="img-responsive img-round img-shadow product-banner"
      loading="lazy"
      decoding="async"
    />

    <table class="products">
      <caption>Product List</caption>
      <tr>
        <th>Name</th>
        <th>Price</th>
      </tr>
      <tr>
        <td>Product A</td>
        <td>$0.00</td>
      </tr>
      <tr>
        <td>Product B</td>
        <td>$0.00</td>
      </tr>
    </table>
  </main>

  <footer>
    <p>My New Website – 2026</p>
  </footer>

  <script>
    const toggle = document.querySelector(".nav-toggle");
    const nav = document.querySelector(".nav-links");

    toggle.addEventListener("click", () => {
      nav.classList.toggle("show");
    });
  </script>
</body>
</html>

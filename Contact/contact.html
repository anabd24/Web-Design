<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- FIXED CSS PATH -->
  <link rel="stylesheet" href="/Web-Design/style.css">
</head>

<body>
  <header>
    <h1>Contact</h1>
    <button class="nav-toggle" aria-label="Toggle navigation">☰</button>

    <nav class="nav-links">
      <a href="/Web-Design/Home/index.html">Home</a>
      <a href="/Web-Design/Product/product.html">Product</a>
      <a href="/Web-Design/Contact/contact.html">Contact</a>
    </nav>
  </header>

  <main class="container">
    <!-- FIXED IMAGE PATH -->
    <img
      src="/Web-Design/Image/Contact.png"
      alt="Contact illustration with envelope, phone and message icons on pink background"
      class="img-responsive img-round img-shadow contact-photo"
      loading="lazy"
      decoding="async"
    />

    <p>Phone: (641) 555-1234</p>
    <p>Email: webdesign@example.com</p>

    <!-- LU10 Responsive Form -->
    <form class="contact-form" action="#" method="post">

      <div class="form-row">
        <label for="name">Name</label>
        <input id="name" type="text" name="name" required>
      </div>

      <div class="form-row">
        <label for="email">Email</label>
        <input id="email" type="email" name="email" required>
      </div>

      <div class="form-row full">
        <label for="message">Comment</label>
        <textarea id="message" name="message" rows="5" required></textarea>
      </div>

      <button class="btn" type="submit">Send</button>

    </form>
  </main>

  <footer class="container">
    <p>My New Website – 2026</p>
  </footer>

  <script>
    const toggle = document.querySelector(".nav-toggle");
    const nav = document.querySelector(".nav-links");

    toggle.addEventListener("click", () => {
      nav.classList.toggle("show");
    });
  </script>
</body>
</html>
